<!DOCTYPE html>
<html>
<head>
    <title>Bay Area Events</title>
</head>
<body>
    <h1>Bay Area Events</h1>

    {% for event in events %}
    <div>
        <h2>{{ event.name}}</h2>
        <p>Date: {{ event.dates.start.localDate}}</p>
        <p>Venue: {{ event._embedded.venues[0].name}}, {{ event._embedded.venues[0].city.name}}</p>
        <a href = "{{ event.url }}">Buy Tickets</a>
    
    </div>    
    <hr>
    {% endfor %}

</body>
</html>
